name: 정기 데이터 수집 (뉴스/가격/AIS)

on:
  schedule:
    # 매일 07:00 KST = 전날 22:00 UTC. 필요에 맞게 조정하세요.
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    # 저장소 루트에 이미 flask_dashboard 폴더의 내용물이 그대로 커밋되어 있어서
    # (app.py, services/, scripts/ 등이 루트에 바로 있음) 별도 working-directory가 필요 없다.
    # 예전에 "flask_dashboard"로 지정했다가 그런 하위 폴더가 없어 체크아웃 직후
    # "No such file or directory" 에러로 곧바로 실패했다.
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 + 가격(유가/환율/천연가스/도시가스요금) 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python scripts/run_collect.py news
          python scripts/run_collect.py price

      - name: LNG선 AIS 위치 수집 (API 키가 있을 때만 동작)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python scripts/run_collect.py ship
