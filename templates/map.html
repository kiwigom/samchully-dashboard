{% extends "base.html" %}
{% block title %}LNG선 지도{% endblock %}
{% block content %}
<h1>LNG선 위치</h1>

<form method="post" action="{{ url_for('refresh_map') }}" class="refresh-form">
    <button type="submit">LNG선 위치 수집 (AIS 실시간 신호 대기)</button>
    <span class="meta">약 1분간 실시간 AIS 신호를 기다렸다가 지도에 반영합니다. aisstream.io API 키가 필요합니다.</span>
</form>

<section class="card">
    <iframe src="{{ url_for('map_embed') }}" width="100%" height="600" style="border:none;"></iframe>
</section>
{% endblock %}
